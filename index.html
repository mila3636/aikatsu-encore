<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AIKATSU! ENCORE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(135deg, #fff0f7, #ffe0ef);
      color: #5a3150;
    }

    header {
      text-align: center;
      padding: 24px 16px;
      background: linear-gradient(135deg, #ff75b5, #ffb6d9);
      color: white;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
    }

    .collection {
      margin: 18px;
      padding: 18px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(255, 100, 170, 0.15);
    }

    .collection-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .progress-bg {
      width: 100%;
      height: 12px;
      background: #f6d6e7;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff70b3, #ffb3d7);
      transition: 0.3s;
    }

    .filters {
      padding: 0 18px;
    }

    .filters input,
    .filters select {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 2px solid #ffc4df;
      border-radius: 12px;
      background: white;
      color: #5a3150;
      font-size: 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 8px 18px 30px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 4px 12px rgba(200, 80, 140, 0.15);
      position: relative;
    }

    .card-image {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: linear-gradient(135deg, #ffe1ef, #fff5fa);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d88bad;
      font-size: 12px;
      text-align: center;
      overflow: hidden;
    }
    .card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

    .card-info {
      padding-top: 9px;
    }

    .batch {
      display: inline-block;
      background: #ff83ba;
      color: white;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .card-number {
      font-size: 12px;
      color: #a66b89;
    }

    .character {
      font-weight: bold;
      margin-top: 3px;
    }

    .details {
      font-size: 11px;
      margin-top: 5px;
      line-height: 1.6;
      color: #866074;
    }

    .get-button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      border: none;
      border-radius: 12px;
      background: #ff76b5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .get-button.owned {
      background: #d8a6bd;
    }

    @media (min-width: 600px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    /* カード詳細画面 */
.card-detail {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(255, 220, 238, 0.95);
  padding: 25px 18px;
  overflow-y: auto;
}

.card-detail.show {
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-detail-box {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 28px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(200, 80, 140, 0.25);
}

.card-detail-title {
  font-size: 22px;
  font-weight: bold;
  color: #e05a98;
  margin-bottom: 18px;
  letter-spacing: 1px;
  text-shadow: 0 2px 5px rgba(255, 130, 190, 0.25);
}

.card-detail-image {
  width: 78%;
  max-width: 290px;
  aspect-ratio: 3 / 4;
  margin: 0 auto 18px;
  border-radius: 18px;
  overflow: hidden;
  border: 4px solid #ffc1df;
  box-shadow:
    0 0 0 3px #fff,
    0 6px 18px rgba(255, 105, 175, 0.3);
}

.card-detail-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-detail-batch {
  display: inline-block;
  background: #ff83ba;
  color: white;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  margin-bottom: 8px;
}

.card-detail-number {
  color: #a66b89;
  font-size: 13px;
}

.card-detail-character {
  font-size: 22px;
  font-weight: bold;
  margin: 5px 0;
  color: #5a3150;
}

.card-detail-info {
  background: linear-gradient(135deg, #fff0f8, #fff8fc);
  border: 2px solid #ffc9e2;
  border-radius: 18px;
  padding: 12px 15px;
  margin: 12px 0 18px;
  color: #80536b;
  line-height: 2;
  font-size: 13px;
  box-shadow: inset 0 0 10px rgba(255, 150, 200, 0.08);
}

.card-detail-close {
  width: 100%;
  margin-top: 10px;
  padding: 11px;
  border: 2px solid #ffc4df;
  border-radius: 18px;

  color: #a65b80;
  font-weight: bold;
  font-size: 14px;

}

.card-detail-close:active {
  transform: scale(0.97);

}
    #detailGetButton {
  margin-top: 5px;
  padding: 13px;
  border-radius: 18px;
  background: linear-gradient(135deg, #ff6eaf, #ff9ac8);
  color: white;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 1px;
  box-shadow: 0 5px 12px rgba(255, 105, 175, 0.3);
}

#detailGetButton.owned {
  background: linear-gradient(135deg, #d99bbd, #e8bdd4);
  box-shadow: none;
}

    .favorite-button {
  width: 100%;
  margin-top: 10px;
  padding: 11px;
  border: 2px solid #ff9ac8;
  border-radius: 18px;
  background: white;
  color: #d85b91;
  font-weight: bold;
  font-size: 14px;
}

.favorite-button.active {
  background: #ffe0ef;
  color: #d84b8d;
  box-shadow: 0 4px 10px rgba(255, 105, 175, 0.2);
}

   .card-count-list {
  margin-top: 6px;
  padding: 5px 8px;
  border-radius: 10px;
  background: #fff0f7;
  color: #d85b91;
  font-size: 12px;
  font-weight: bold;
  text-align: center;
  border: 1px solid #ffc9e2;
} 

    .total-count {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 15px;
  background: linear-gradient(135deg, #fff0f8, #ffe5f2);
  border: 2px solid #ffc4df;
  color: #d85b91;
  font-size: 13px;
  font-weight: bold;
  text-align: center;
  box-shadow:
    0 3px 8px rgba(255, 105, 175, 0.12),
    inset 0 0 8px rgba(255, 170, 210, 0.15);
}

.total-count span {
  font-size: 16px;
  color: #e05291;
  margin: 0 2px;
}

    .batch-progress {
  margin-top: 12px;
}

.batch-progress-item {
  margin-bottom: 10px;
  padding: 10px 12px;
  border-radius: 15px;
  background: #fff8fc;
  border: 1px solid #ffc9e2;
}

.batch-progress-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  color: #d85b91;
  font-size: 12px;
  font-weight: bold;
}

.batch-progress-bg {
  width: 100%;
  height: 10px;
  background: #ffe3f0;
  border-radius: 10px;
  overflow: hidden;
}

.batch-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #ff75b5, #ffb6d9);
  border-radius: 10px;
  transition: width 0.3s ease;
}

    .tabs {
  display: flex;
  gap: 6px;
  padding: 10px 12px;
  background: #fff8fc;
  border-bottom: 1px solid #ffc9e2;
}

.tab {
  flex: 1;
  padding: 10px 4px;
  border: none;
  border-radius: 14px;
  background: #ffe5f1;
  color: #c95b8d;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

.tab.active {
  background: linear-gradient(135deg, #ff75b5, #ffb6d9);
  color: white;
  box-shadow: 0 3px 8px rgba(255, 105, 175, 0.2);
}

.tab:active {
  transform: scale(0.96);
}

.home {
  padding: 22px 18px 30px;
}

.home-title {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  color: #5a3150;
  margin-bottom: 8px;
}

.home-message {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  color: #d85b91;
  margin-bottom: 20px;
}

.home-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.home-stat {
  background: white;
  border-radius: 20px;
  padding: 16px 10px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(255, 100, 170, 0.12);
  border: 2px solid #ffc9e2;
}

.home-stat-icon {
  font-size: 26px;
  margin-bottom: 6px;
}

.home-stat-label {
  font-size: 12px;
  color: #a66b89;
  font-weight: bold;
}

.home-stat-value {
  margin-top: 5px;
  font-size: 18px;
  color: #d85b91;
  font-weight: bold;
}

.home-exchange-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: white;
  border: 2px solid #ffc9e2;
  border-radius: 20px;
  padding: 15px;
  box-shadow: 0 5px 15px rgba(255, 100, 170, 0.12);
}

.home-exchange-icon {
  font-size: 28px;
}

.home-exchange-text {
  flex: 1;
}

.home-exchange-title {
  font-size: 15px;
  font-weight: bold;
  color: #d85b91;
}

.home-exchange-message {
  margin-top: 4px;
  font-size: 11px;
  color: #866074;
}

.home-exchange-arrow {
  font-size: 28px;
  color: #d85b91;
}
    
  </style>
</head>

<body>

  <header>
    <h1>🎀 AIKATSU! ENCORE 🎀</h1>
    <p>MY CARD COLLECTION</p>
  </header>

<nav class="tabs">
  <button class="tab active" onclick="showTab('home')">
    🏠 ホーム
  </button>

  <button class="tab" onclick="showTab('cards')">
    📖 図鑑
  </button>

  <button class="tab" onclick="showTab('exchange')">
    🔄 交換
  </button>
</nav>

<section class="home" id="home">

  <div class="home-title">
    🎀 AIKATSU! ENCORE 🎀
  </div>

  <div class="home-message">
    💖 MY CARD COLLECTION 💖
  </div>

  <div class="home-stats">

    <div class="home-stat">
      <div class="home-stat-icon">💗</div>

      <div class="home-stat-label">

      </div>

  >

</section>
  
  <section class="collection">
    <div class="collection-title">
  <span>💖 COLLECTION</span>
  <span id="count">0 / 3</span>
</div>

<div class="total-count">
  💗 総所持枚数：<span id="totalCount">0</span>枚
</div>

    <div class="batch-progress" id="batchProgress"></div>

    <div class="progress-bg">
      <div class="progress" id="progress"></div>
    </div>
  </section>

  <section class="filters">

    <input
      type="text"
      id="search"
      placeholder="🔍 キャラクター・カード番号を検索"
    >

    <select id="batchFilter">
      <option value="all">🎀 すべての弾</option>
      <option value="第1弾">第1弾</option>
      <option value="第2弾">第2弾</option>
      <option value="第3弾">第3弾</option>
    </select>

    <select id="ownedFilter">
  <option value="all">💗 すべて</option>
  <option value="owned">💖 持っている</option>
  <option value="notOwned">🤍 持っていない</option>
  <option value="favorite">💗 お気に入り</option>
</select>

  </section>

  <main class="cards" id="cards"></main>
<!-- カード詳細画面 -->
<div class="card-detail" id="cardDetail">

  <div class="card-detail-box">

    <div class="card-detail-title">
      🎀 CARD DETAIL 🎀
    </div>

    <div class="card-detail-image">
      <img id="detailImage" src="" alt="">
    </div>

    <div class="card-detail-batch" id="detailBatch"></div>

    <div class="card-detail-number" id="detailNumber"></div>

    <div class="card-detail-character" id="detailCharacter"></div>

    <div class="card-detail-info" id="detailInfo"></div>

<div class="card-count">
  <button id="countMinus">−</button>
  <span id="cardCount">0</span>
  <button id="countPlus">＋</button>
  <div>💗 所持枚数</div>
</div>
    
    <button
      class="get-button"
      id="detailGetButton"
    >
      💖 GET！
    </button>
    
<button
  class="favorite-button"
  id="favoriteButton"
>
  ♡ お気に入り
</button>
    
    <button
      class="card-detail-close"
      id="detailClose"
    >
      ✕ 閉じる
    </button>

  </div>

</div>
  <script>

    const cards = [
  {
    id: "A-001",
    batch: "第1弾",
    character: "星宮いちご",
    brand: "STAR☆ANIS",
    rarity: "PR",
    part: "トップス",
    image: "https://mila3636.github.io/aikatsu-encore/IMG_8745.webp"
  },

  {
    id: "A-002",
    batch: "第1弾",
    character: "霧矢あおい",
    brand: "STAR☆ANIS",
    rarity: "R",
    part: "ボトムス",
    image: "https://mila3636.github.io/aikatsu-encore/IMG_8746.webp"
  },

  {
    id: "A-003",
    batch: "第2弾",
    character: "紫吹蘭",
    brand: "SPICY AGEHA",
    rarity: "SR",
    part: "シューズ",
    image: "https://mila3636.github.io/aikatsu-encore/IMG_8747.webp"
  }
];

    let ownedCards =
      JSON.parse(localStorage.getItem("aikatsuOwned")) || [];

    let favoriteCards =
  JSON.parse(localStorage.getItem("aikatsuFavorites")) || [];

let cardCounts =
  JSON.parse(localStorage.getItem("aikatsuCardCounts")) || {};
    
    const cardsArea = document.getElementById("cards");
    const count = document.getElementById("count");
    const progress = document.getElementById("progress");

    const search = document.getElementById("search");
    const batchFilter = document.getElementById("batchFilter");
    const ownedFilter = document.getElementById("ownedFilter");


    function renderCards() {

      cardsArea.innerHTML = "";

      const searchWord =
        search.value.toLowerCase();

      const selectedBatch =
        batchFilter.value;

      const selectedOwned =
        ownedFilter.value;


      const filteredCards = cards.filter(card => {

        const matchesSearch =
          card.character.toLowerCase().includes(searchWord) ||
          card.id.toLowerCase().includes(searchWord);

        const matchesBatch =
          selectedBatch === "all" ||
          card.batch === selectedBatch;

        const isOwned =
          ownedCards.includes(card.id);

        const isFavorite =
  favoriteCards.includes(card.id);

const matchesOwned =
  selectedOwned === "all" ||
  (selectedOwned === "owned" && isOwned) ||
  (selectedOwned === "notOwned" && !isOwned) ||
  (selectedOwned === "favorite" && isFavorite);
        
        return (
          matchesSearch &&
          matchesBatch &&
          matchesOwned
        );
      });


filteredCards.forEach(card => {

  const isOwned =
    ownedCards.includes(card.id);

  const cardElement =
    document.createElement("div");

  cardElement.className = "card";

  cardElement.addEventListener("click", () => {
    openCardDetail(card);
  });

  cardElement.innerHTML = `

    <div class="card-image">
      <img src="${card.image}" alt="${card.character}">
    </div>

    <div class="card-info">

      <span class="batch">
        ${card.batch}
      </span>

      <div class="card-number">
        ${card.id}
      </div>

      <div class="character">
        ${card.character}
      </div>

      <div class="card-count-list">
  💗 所持：${cardCounts[card.id] || 0}枚
</div>

      <div class="details">
        🏷️ ${card.brand}<br>
        💎 ${card.rarity}<br>
        👗 ${card.part}
      </div>

      <button
        class="get-button ${isOwned ? "owned" : ""}"
        onclick="toggleOwned('${card.id}'); event.stopPropagation();"
      >
        ${isOwned ? "💖 GET済み" : "💖 GET！"}
      </button>

    </div>
  `;

  cardsArea.appendChild(cardElement);
});

      updateCollection();

    }

    function openCardDetail(card) {

  document.getElementById("detailImage").src = card.image;
  document.getElementById("detailImage").alt = card.character;

  document.getElementById("detailBatch").textContent =
    card.batch;

  document.getElementById("detailNumber").textContent =
    card.id;

  document.getElementById("detailCharacter").textContent =
    card.character;

  document.getElementById("detailInfo").innerHTML =
    `🏷️ ${card.brand}<br>
     💎 レアリティ：${card.rarity}<br>
     👗 部位：${card.part}`;

  const detailButton =
    document.getElementById("detailGetButton");

  const isOwned =
    ownedCards.includes(card.id);

const cardCount =
  cardCounts[card.id] || 0;

document.getElementById("cardCount").textContent =
  cardCount;

document.getElementById("countMinus").onclick = () => {

  const current =
    cardCounts[card.id] || 0;

  if (current > 0) {
    cardCounts[card.id] = current - 1;
  }

  if ((cardCounts[card.id] || 0) === 0) {
    ownedCards =
      ownedCards.filter(cardId => cardId !== card.id);
  }

  localStorage.setItem(
    "aikatsuCardCounts",
    JSON.stringify(cardCounts)
  );

  localStorage.setItem(
    "aikatsuOwned",
    JSON.stringify(ownedCards)
  );

  openCardDetail(card);
};

document.getElementById("countPlus").onclick = () => {

  const current =
    cardCounts[card.id] || 0;

  cardCounts[card.id] = current + 1;

  if (!ownedCards.includes(card.id)) {
    ownedCards.push(card.id);
  }

  localStorage.setItem(
    "aikatsuCardCounts",
    JSON.stringify(cardCounts)
  );

  localStorage.setItem(
    "aikatsuOwned",
    JSON.stringify(ownedCards)
  );

  openCardDetail(card);
};
      
  detailButton.textContent =
    isOwned ? "💖 GET済み" : "💖 GET！";

  detailButton.className =
    `get-button ${isOwned ? "owned" : ""}`;

  detailButton.onclick = () => {
    toggleOwned(card.id);
    openCardDetail(card);
  };

const favoriteButton =
  document.getElementById("favoriteButton");

const isFavorite =
  favoriteCards.includes(card.id);

favoriteButton.textContent =
  isFavorite ? "💗 お気に入り" : "♡ お気に入り";

favoriteButton.className =
  `favorite-button ${isFavorite ? "active" : ""}`;

favoriteButton.onclick = () => {

  if (favoriteCards.includes(card.id)) {

    favoriteCards =
      favoriteCards.filter(
        cardId => cardId !== card.id
      );

  } else {

    favoriteCards.push(card.id);

  }

  localStorage.setItem(
    "aikatsuFavorites",
    JSON.stringify(favoriteCards)
  );

  openCardDetail(card);
};
      
  document
    .getElementById("cardDetail")
    .classList.add("show");
}

    document.getElementById("detailClose").addEventListener("click", () => {

  document
    .getElementById("cardDetail")
    .classList.remove("show");

});

    function toggleOwned(id) {

  if (ownedCards.includes(id)) {

    // GET済み → 所持枚数を0枚にする
    ownedCards =
      ownedCards.filter(cardId => cardId !== id);

    cardCounts[id] = 0;

  } else {

    // 未所持 → 所持枚数を1枚にする
    ownedCards.push(id);

    if ((cardCounts[id] || 0) === 0) {
      cardCounts[id] = 1;
    }
  }

  localStorage.setItem(
    "aikatsuOwned",
    JSON.stringify(ownedCards)
  );

  localStorage.setItem(
    "aikatsuCardCounts",
    JSON.stringify(cardCounts)
  );

  renderCards();
}


    function updateCollection() {

      const ownedCount =
        cards.filter(card =>
          ownedCards.includes(card.id)
        ).length;

      const total =
        cards.length;

      let totalCardCount = 0;

cards.forEach(card => {
  totalCardCount +=
    cardCounts[card.id] || 0;
});

document.getElementById("totalCount").textContent =
  totalCardCount;

      document.getElementById("homeTotalCount").textContent =
  totalCardCount;

document.getElementById("homeOwnedCount").textContent =
  ownedCount;

document.getElementById("homeCardTotal").textContent =
  total;

      const batches = [...new Set(cards.map(card => card.batch))];

document.getElementById("batchProgress").innerHTML =
  batches.map(batch => {

    const batchCards =
      cards.filter(card => card.batch === batch);

    const batchOwned =
      batchCards.filter(card =>
        ownedCards.includes(card.id)
      ).length;

    const batchTotal =
      batchCards.length;

    const batchPercent =
      batchTotal === 0
        ? 0
        : (batchOwned / batchTotal) * 100;

    return `
      <div class="batch-progress-item">
        <div class="batch-progress-title">
          <span>💖 ${batch}</span>
          <span>${batchOwned} / ${batchTotal}枚</span>
        </div>

        <div class="batch-progress-bg">
          <div
            class="batch-progress-bar"
            style="width: ${batchPercent}%">
          </div>
        </div>
      </div>
    `;

  }).join("");

      count.textContent =
        `${ownedCount} / ${total}`;

      const percent =
        total === 0
          ? 0
          : (ownedCount / total) * 100;

      progress.style.width =
        `${percent}%`;

    }


    search.addEventListener(
      "input",
      renderCards
    );

    batchFilter.addEventListener(
      "change",
      renderCards
    );

    ownedFilter.addEventListener(
      "change",
      renderCards
    );

function showTab(tabName) {

  const tabs =
    document.querySelectorAll(".tab");

  const home =
    document.getElementById("home");

  const collection =
    document.querySelector(".collection");

  const filters =
    document.querySelector(".filters");

  const cardsArea =
    document.querySelector(".cards");

  tabs.forEach(tab => {
    tab.classList.remove("active");
  });

  home.style.display = "none";
  collection.style.display = "none";
  filters.style.display = "none";
  cardsArea.style.display = "none";


  if (tabName === "home") {

    tabs[0].classList.add("active");

    home.style.display = "block";

  }


  if (tabName === "cards") {

    tabs[1].classList.add("active");

    collection.style.display = "block";
    filters.style.display = "block";
    cardsArea.style.display = "grid";

  }


  if (tabName === "exchange") {

    tabs[2].classList.add("active");

  }

}
    
    showTab("home");
renderCards();

  </script>
