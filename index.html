<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AIKATSU! ENCORE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(135deg, #fff0f7, #ffe0ef);
      color: #5a3150;
    }

    header {
      text-align: center;
      padding: 24px 16px;
      background: linear-gradient(135deg, #ff75b5, #ffb6d9);
      color: white;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
    }

    .collection {
      margin: 18px;
      padding: 18px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(255, 100, 170, 0.15);
    }

    .collection-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .progress-bg {
      width: 100%;
      height: 12px;
      background: #f6d6e7;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff70b3, #ffb3d7);
      transition: 0.3s;
    }

    .filters {
      padding: 0 18px;
    }

    .filters input,
    .filters select {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 2px solid #ffc4df;
      border-radius: 12px;
      background: white;
      color: #5a3150;
      font-size: 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 8px 18px 30px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 4px 12px rgba(200, 80, 140, 0.15);
      position: relative;
    }

    .card-image {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: linear-gradient(135deg, #ffe1ef, #fff5fa);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d88bad;
      font-size: 12px;
      text-align: center;
      overflow: hidden;
    }
    .card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

    .card-info {
      padding-top: 9px;
    }

    .batch {
      display: inline-block;
      background: #ff83ba;
      color: white;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .card-number {
      font-size: 12px;
      color: #a66b89;
    }

    .character {
      font-weight: bold;
      margin-top: 3px;
    }

    .details {
      font-size: 11px;
      margin-top: 5px;
      line-height: 1.6;
      color: #866074;
    }

    .get-button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      border: none;
      border-radius: 12px;
      background: #ff76b5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .get-button.owned {
      background: #d8a6bd;
    }

    @media (min-width: 600px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    /* カード詳細画面 */
.card-detail {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(255, 220, 238, 0.95);
  padding: 25px 18px;
  overflow-y: auto;
}

.card-detail.show {
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-detail-box {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 28px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(200, 80, 140, 0.25);
}

.card-detail-title {
  font-size: 20px;
  font-weight: bold;
  color: #d85b91;
  margin-bottom: 15px;
}

.card-detail-image {
  width: 75%;
  max-width: 280px;
  aspect-ratio: 3 / 4;
  margin: 0 auto 15px;
  border-radius: 16px;
  overflow: hidden;
}

.card-detail-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-detail-batch {
  display: inline-block;
  background: #ff83ba;
  color: white;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  margin-bottom: 8px;
}

.card-detail-number {
  color: #a66b89;
  font-size: 13px;
}

.card-detail-character {
  font-size: 22px;
  font-weight: bold;
  margin: 5px 0;
  color: #5a3150;
}

.card-detail-info {
  color: #866074;
  line-height: 1.8;
  margin-bottom: 15px;
}

.card-detail-close {
  width: 100%;
  padding: 11px;
  border: none;
  border-radius: 15px;
  background: #f1c5da;
  color: #6d4058;
  font-weight: bold;
  font-size: 14px;
}
  </style>
</head>

<body>

  <header>
    <h1>🎀 AIKATSU! ENCORE 🎀</h1>
    <p>MY CARD COLLECTION</p>
  </header>

  <section class="collection">
    <div class="collection-title">
      <span>💖 COLLECTION</span>
      <span id="count">0 / 3</span>
    </div>

    <div class="progress-bg">
      <div class="progress" id="progress"></div>
    </div>
  </section>

  <section class="filters">

    <input
      type="text"
      id="search"
      placeholder="🔍 キャラクター・カード番号を検索"
    >

    <select id="batchFilter">
      <option value="all">🎀 すべての弾</option>
      <option value="第1弾">第1弾</option>
      <option value="第2弾">第2弾</option>
      <option value="第3弾">第3弾</option>
    </select>

    <select id="ownedFilter">
      <option value="all">💗 すべて</option>
      <option value="owned">💖 持っている</option>
      <option value="notOwned">🤍 持っていない</option>
    </select>

  </section>

  <main class="cards" id="cards"></main>
<!-- カード詳細画面 -->
<div class="card-detail" id="cardDetail">

  <div class="card-detail-box">

    <div class="card-detail-title">
      🎀 CARD DETAIL 🎀
    </div>

    <div class="card-detail-image">
      <img id="detailImage" src="" alt="">
    </div>

    <div class="card-detail-batch" id="detailBatch"></div>

    <div class="card-detail-number" id="detailNumber"></div>

    <div class="card-detail-character" id="detailCharacter"></div>

    <div class="card-detail-info" id="detailInfo"></div>

    <button
      class="get-button"
      id="detailGetButton"
    >
      💖 GET！
    </button>

    <button
      class="card-detail-close"
      id="detailClose"
    >
      ✕ 閉じる
    </button>

  </div>

</div>
  <script>

    const cards = [
  {
    id: "A-001",
    batch: "第1弾",
    character: "星宮いちご",
    brand: "STAR☆ANIS",
    rarity: "PR",
    part: "トップス",
    image: "https://mila3636.github.io/aikatsu-encore/IMG_8745.webp"
  },

  {
    id: "A-002",
    batch: "第1弾",
    character: "霧矢あおい",
    brand: "STAR☆ANIS",
    rarity: "R",
    part: "ボトムス",
    image: "https://mila3636.github.io/aikatsu-encore/IMG_8746.webp"
  },

  {
    id: "A-003",
    batch: "第2弾",
    character: "紫吹蘭",
    brand: "SPICY AGEHA",
    rarity: "SR",
    part: "シューズ",
    image: "https://mila3636.github.io/aikatsu-encore/IMG_8747.webp"
  }
];

    let ownedCards =
      JSON.parse(localStorage.getItem("aikatsuOwned")) || [];

    const cardsArea = document.getElementById("cards");
    const count = document.getElementById("count");
    const progress = document.getElementById("progress");

    const search = document.getElementById("search");
    const batchFilter = document.getElementById("batchFilter");
    const ownedFilter = document.getElementById("ownedFilter");


    function renderCards() {

      cardsArea.innerHTML = "";

      const searchWord =
        search.value.toLowerCase();

      const selectedBatch =
        batchFilter.value;

      const selectedOwned =
        ownedFilter.value;


      const filteredCards = cards.filter(card => {

        const matchesSearch =
          card.character.toLowerCase().includes(searchWord) ||
          card.id.toLowerCase().includes(searchWord);

        const matchesBatch =
          selectedBatch === "all" ||
          card.batch === selectedBatch;

        const isOwned =
          ownedCards.includes(card.id);

        const matchesOwned =
          selectedOwned === "all" ||
          (selectedOwned === "owned" && isOwned) ||
          (selectedOwned === "notOwned" && !isOwned);

        return (
          matchesSearch &&
          matchesBatch &&
          matchesOwned
        );
      });


      filteredCards.forEach(card => {

        const isOwned =
          ownedCards.includes(card.id);

        const cardElement =
          document.createElement("div");

        cardElement.className = "card";

        cardElement.innerHTML = `

          <div class="card-image">
          <img src="${card.image}" alt="${card.character}">
</div>

          <div class="card-info">

            <span class="batch">
              ${card.batch}
            </span>

            <div class="card-number">
              ${card.id}
            </div>

            <div class="character">
              ${card.character}
            </div>

            <div class="details">
              🏷️ ${card.brand}<br>
              💎 ${card.rarity}<br>
              👗 ${card.part}
            </div>

            <button
              class="get-button ${isOwned ? "owned" : ""}"
              onclick="toggleOwned('${card.id}')"
            >
              ${isOwned ? "💖 GET済み" : "💖 GET！"}
            </button>

          </div>
        `;

        cardsArea.appendChild(cardElement);
      });

      updateCollection();

    }


    function toggleOwned(id) {

      if (ownedCards.includes(id)) {

        ownedCards =
          ownedCards.filter(cardId => cardId !== id);

      } else {

        ownedCards.push(id);

      }

      localStorage.setItem(
        "aikatsuOwned",
        JSON.stringify(ownedCards)
      );

      renderCards();

    }


    function updateCollection() {

      const ownedCount =
        cards.filter(card =>
          ownedCards.includes(card.id)
        ).length;

      const total =
        cards.length;

      count.textContent =
        `${ownedCount} / ${total}`;

      const percent =
        total === 0
          ? 0
          : (ownedCount / total) * 100;

      progress.style.width =
        `${percent}%`;

    }


    search.addEventListener(
      "input",
      renderCards
    );

    batchFilter.addEventListener(
      "change",
      renderCards
    );

    ownedFilter.addEventListener(
      "change",
      renderCards
    );


    renderCards();

  </script>

</body>
</html>
